<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AgriShift — The Farm Time Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B1F2A;--forest:#164A3A;--teal:#168C87;--paper:#F5F4EE;--sand:#D9C7A3;--amber:#E7A93B;--red:#C85C55;
--bg:var(--paper);--ink:#0B1F2A;--mute:#4d5f68;--card:#fff;--line:#0b1f2a1f;--data:var(--navy);--data-ink:#e8efe9;--data-mute:#8fa5ad;
--h:'Sora','Noto Sans Bengali',system-ui,sans-serif;--b:'IBM Plex Sans','Noto Sans Bengali',system-ui,sans-serif;--m:'IBM Plex Mono',ui-monospace,monospace;
--r:8px;--s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:40px;--s6:72px}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#08161e;--ink:#eef0e8;--mute:#93a7af;--card:#0e2a37;--line:#ffffff1f;--data:#06131a}}
:root[data-theme=dark]{--bg:#08161e;--ink:#eef0e8;--mute:#93a7af;--card:#0e2a37;--line:#ffffff1f;--data:#06131a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--b);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--h);line-height:1.08;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,6vw,4.8rem);font-weight:700}h2{font-size:clamp(1.6rem,3vw,2.4rem);font-weight:600}h3{font-size:1.1rem;font-weight:600;letter-spacing:0}
p{margin:0;max-width:64ch}.mono{font-family:var(--m)}.mute{color:var(--mute)}
a{color:inherit}:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 var(--s4)}
/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#eef0e8}
.nav{display:flex;align-items:center;gap:var(--s4);height:60px}
.logo{font:700 1.15rem var(--h);text-decoration:none;display:flex;align-items:center;gap:10px;margin-right:auto}
.logo i{width:20px;height:20px;border:2px solid var(--amber);border-radius:50%;position:relative}
.logo i:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--teal)}
.links{display:flex;gap:var(--s1)}
.links a{padding:8px 12px;border-radius:var(--r);text-decoration:none;font-size:.92rem;color:#b9c9cd}
.links a:hover,.links a[aria-current=page]{color:#fff;background:#ffffff14}
.right{display:flex;align-items:center;gap:var(--s3)}
.lang{display:flex;border:1px solid #ffffff33;border-radius:var(--r);overflow:hidden}
.lang button{background:none;border:0;color:#b9c9cd;padding:5px 10px;font:500 .8rem var(--b);cursor:pointer}
.lang button[aria-pressed=true]{background:#ffffff1f;color:#fff}
.demo{display:flex;align-items:center;gap:8px;font:500 .74rem var(--m);letter-spacing:.06em;color:var(--amber);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--amber);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:860px){.nav{flex-wrap:wrap;height:auto;padding:10px 0;gap:var(--s2) var(--s3)}.links{order:3;width:100%;overflow-x:auto}.demo span{display:none}}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--r);font:600 .95rem var(--b);text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .2s}
.btn-p{background:var(--forest);color:#fff}.btn-p:hover{background:#0f3a2d}
.btn-s{background:none;border-color:var(--line);color:var(--ink)}.btn-s:hover{background:#0b1f2a0d}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--m);letter-spacing:.04em;padding:3px 8px;border-radius:4px;border:1px solid var(--line);color:var(--mute);background:transparent}
.badge.src{color:var(--teal);border-color:#168c8766}
.badge.demo-l{color:#8a5f0a;border-color:#e7a93b99;background:#e7a93b1f}
.badge.scen{color:#8a5f0a;border-color:var(--amber);background:#e7a93b2b}
.badge.risk{color:var(--red);border-color:#c85c5580;background:#c85c5514}
:root[data-theme=dark] .badge.demo-l,:root[data-theme=dark] .badge.scen{color:var(--amber)}
.status{display:inline-flex;align-items:center;gap:8px;font:500 .78rem var(--m)}
.status i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st-live i{background:var(--teal)}.st-demo i{background:var(--amber)}.st-road i{background:none;border:1.5px dashed var(--mute)}
/* layout blocks */
section.blk{padding:var(--s6) 0;border-top:1px solid var(--line)}
.sh{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.grid{display:grid;gap:var(--s3);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4)}
.dark-panel{background:var(--data);color:var(--data-ink);border-radius:var(--r);padding:var(--s4)}
.dark-panel .mute{color:var(--data-mute)}
.metric .val{font:500 2.4rem/1 var(--m);margin:var(--s3) 0 var(--s2)}
.metric .val small{font-size:1rem;color:var(--mute)}
.dark-panel .metric .val small{color:var(--data-mute)}
.row{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center}
/* hero */
.hero{background:var(--navy);color:#eef0e8;padding:var(--s6) 0 var(--s5);position:relative;overflow:hidden}
.hero .wrap{display:grid;gap:var(--s4)}
.hero p{color:#b9c9cd;font-size:1.15rem}
.hero .tag{font:500 1rem var(--m);color:var(--amber)}
.rings{position:absolute;right:-120px;top:-120px;width:560px;height:560px;opacity:.5;pointer-events:none}
/* slider + timeline */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--line);border-radius:2px;outline-offset:8px}
.dark-panel input[type=range]{background:#ffffff33}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--amber);border:3px solid var(--navy);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amber);border:3px solid var(--navy);cursor:pointer}
.ctl{display:grid;gap:var(--s3)}.ctl .top{display:flex;justify-content:space-between;align-items:baseline}
.tl{display:flex;justify-content:space-between;font:400 .75rem var(--m);color:var(--data-mute);position:relative;padding-top:14px}
.tl:before{content:"";position:absolute;left:0;right:0;top:4px;height:1px;background:#ffffff33}
.tl span{position:relative}.tl span:before{content:"";position:absolute;left:50%;top:-14px;width:1px;height:8px;background:#ffffff55}
.tl span.on{color:var(--amber)}.tl span.on:before{background:var(--amber)}
/* map container */
.map{aspect-ratio:16/8;min-height:220px;border-radius:var(--r);background:var(--data);color:var(--data-mute);position:relative;overflow:hidden;display:grid;place-items:center;text-align:center;font:400 .85rem var(--m);
background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:40px 40px}
.map .badge{position:absolute;left:12px;top:12px;color:var(--amber);border-color:#e7a93b66}
/* rotation card */
.rot .seq{display:flex;gap:6px;margin:var(--s3) 0}
.rot .seq span{flex:1;padding:8px 4px;text-align:center;font:500 .78rem var(--m);border-radius:4px;background:#164a3a1a;color:var(--forest)}
:root[data-theme=dark] .rot .seq span{color:#8fd1b8;background:#164a3a80}
.rot .foot{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s3)}
/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--card);border-left:1px solid var(--line);z-index:40;padding:var(--s4);transform:translateX(102%);transition:transform .3s ease;overflow:auto;display:grid;align-content:start;gap:var(--s3)}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:#0b1f2a80;z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}.scrim.open{opacity:1;pointer-events:auto}
.x{justify-self:end;background:none;border:1px solid var(--line);color:var(--ink);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.stub{border:1px dashed var(--line);border-radius:var(--r);padding:var(--s4);display:grid;gap:var(--s2)}
footer{background:var(--navy);color:#b9c9cd;padding:var(--s5) 0;font-size:.85rem}
footer p{max-width:80ch}
.view{animation:in .35s ease}@keyframes in{from{opacity:0}}

/* ---- landing ---- */
.hz{background:var(--navy);color:#eef0e8;position:relative;overflow:hidden;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:56px 56px}
.hz .wrap{display:grid;grid-template-columns:1.05fr 1fr;gap:var(--s5);align-items:center;padding-top:var(--s6);padding-bottom:var(--s6);min-height:calc(100vh - 60px)}
.hz h1{font-size:clamp(2.4rem,4.6vw,4.4rem)}.hz h1 span{display:block;animation:up .9s cubic-bezier(.2,.7,.2,1) both}.hz h1 span+span{animation-delay:.18s;color:var(--sand)}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.hz .sup{color:#b9c9cd;font-size:1.15rem;margin:var(--s4) 0;animation:up .9s .4s both}
.hz .ctas{display:flex;flex-wrap:wrap;gap:var(--s3);animation:up .9s .6s both}
.hz .kick{font:500 .78rem var(--m);color:var(--amber);letter-spacing:.06em;margin-bottom:var(--s3);display:flex;gap:10px;align-items:center;animation:up .9s both}
.btn{position:relative;overflow:hidden;transition:transform .25s,background .25s,border-color .25s}
.btn:hover{transform:translateY(-2px)}
.btn:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#ffffff2e 50%,transparent 65%);transform:translateX(-120%);transition:transform .6s}
.btn:hover:after{transform:translateX(120%)}
.hz .btn-p{background:var(--teal)}.hz .btn-p:hover{background:#1ba39d}
.hz .btn-s{color:#eef0e8;border-color:#ffffff40}.hz .btn-s:hover{background:#ffffff14;border-color:#ffffff80}
.vz{border:1px solid #ffffff26;border-radius:var(--r);background:#071822;position:relative;animation:up 1.1s .3s both}
.vz svg{display:block;width:100%;height:auto}
.vz .ro{position:absolute;left:14px;top:12px;font:400 .72rem/1.7 var(--m);color:#8fa5ad;pointer-events:none}
.vz .ro b{display:block;color:#eef0e8;font-weight:500;font-size:.85rem}
.vz .ro .cd{color:var(--amber)}
.vz .tg{position:absolute;right:12px;top:12px}
.vz .tg .badge{color:var(--amber);border-color:#e7a93b66}
.stg{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #ffffff26}
.stg button{background:none;border:0;border-right:1px solid #ffffff1a;color:#8fa5ad;font:500 .7rem var(--m);padding:12px 6px 10px;cursor:pointer;text-align:left;position:relative;transition:color .3s}
.stg button:last-child{border:0}.stg button.on{color:#fff}
.stg button:after{content:"";position:absolute;left:0;top:-1px;height:2px;width:0;background:var(--amber)}
.stg button.on:after{animation:fill 3.4s linear forwards}.stg.paused button.on:after{width:100%;animation:none}
@keyframes fill{to{width:100%}}
.gs .st{opacity:0;transform-origin:240px 240px;transform:scale(1.18);transition:opacity .9s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.gs .st.on{opacity:1;transform:none}
#ret{transform-origin:240px 240px;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.pr{animation:ping 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(2.6);opacity:0}}
.rv{opacity:0;transform:translateY(16px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}
.tag-strip{background:var(--forest);color:#eef0e8;padding:var(--s3) 0;font:500 .95rem var(--m)}
.tag-strip .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--s2)}
.c3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.c3 .card{padding:var(--s4);display:grid;gap:var(--s3);align-content:start;border-top:3px solid var(--teal)}
.c3 .card:nth-child(2){border-top-color:var(--forest)}.c3 .card:nth-child(3){border-top-color:var(--amber)}
.c3 h3{font:700 2rem var(--h);letter-spacing:.01em}
.tlp{padding:var(--s5) var(--s4);display:grid;gap:var(--s4)}
.tlp .big{font:500 clamp(3rem,7vw,5.5rem)/1 var(--m);color:var(--amber)}
.axis{position:relative;height:90px}
.axis:before{content:"";position:absolute;left:0;right:0;top:20px;height:2px;background:#ffffff26}
.axis .fl{position:absolute;left:0;top:20px;height:2px;width:0;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width 3.2s cubic-bezier(.4,0,.2,1)}
.nd{position:absolute;top:12px;transform:translateX(-50%);text-align:center;font:400 .8rem var(--m);color:#8fa5ad}
.nd i{display:block;width:16px;height:16px;border-radius:50%;background:var(--data);border:2px solid #ffffff55;margin:0 auto 12px;transition:.4s}
.nd.on{color:#eef0e8}.nd.on i{border-color:var(--teal);background:var(--teal)}
.nd.fu.on i{border-color:var(--amber);background:var(--data)}
.nd:first-child{transform:none;text-align:left}.nd:first-child i{margin-left:0}.nd:last-child{transform:translateX(-100%);text-align:right}.nd:last-child i{margin-right:0;margin-left:auto}
.nd.y50 i{width:26px;height:26px;margin-top:-5px;border-color:var(--amber);position:relative}
.nd.y50.on i{background:var(--amber);box-shadow:0 0 0 6px #e7a93b33}
.nd.y50 b{color:var(--amber);font-weight:500}
@media(max-width:940px){.hz .wrap{grid-template-columns:1fr;min-height:0}.c3{grid-template-columns:1fr}.nd span{display:none}.nd.y50 span,.nd:first-child span{display:inline}}

/* ---- explorer ---- */
.exh{padding:var(--s6) 0 var(--s4)}
.exg{display:grid;grid-template-columns:minmax(0,1.85fr) minmax(280px,1fr);gap:var(--s3);align-items:stretch}
.exm{position:relative;background:#071822;border:1px solid #ffffff26;border-radius:var(--r);overflow:hidden;min-height:300px;aspect-ratio:2/1;color:#eef0e8}
.exm svg{position:absolute;inset:0;width:100%;height:100%}
#wg{transition:transform 1.7s cubic-bezier(.65,0,.2,1)}
#wg *{vector-effect:non-scaling-stroke}
#wg>g{transition:opacity 1s}
.exm .ov{position:absolute;z-index:2;pointer-events:none}
.exm .tl-l{left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.exm .bc{right:12px;top:12px;display:flex;pointer-events:auto;border:1px solid #ffffff33;border-radius:var(--r);overflow:hidden;background:#071822cc}
.exm .bc button{background:none;border:0;border-right:1px solid #ffffff1f;color:#8fa5ad;font:500 .68rem var(--m);padding:7px 9px;cursor:pointer}
.exm .bc button:last-child{border:0}.exm .bc button.on{color:#fff;background:#ffffff1a}
.exm .yr{left:14px;bottom:10px;font:500 clamp(2.2rem,5vw,3.6rem)/1 var(--m);color:var(--amber)}
.exm .yr small{display:block;font-size:.68rem;color:#8fa5ad;letter-spacing:.04em;margin-top:6px}
.exm .lg{right:12px;bottom:12px;font:400 .68rem var(--m);color:#8fa5ad;width:150px}
.exm .lg i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#168C87,#E7A93B,#C85C55);margin-bottom:4px}
.exm .lg span{display:flex;justify-content:space-between}
.exm .hint{left:50%;bottom:12px;transform:translateX(-50%);font:500 .74rem var(--m);color:#eef0e8;background:#0B1F2Acc;border:1px solid #e7a93b66;padding:6px 12px;border-radius:var(--r);white-space:nowrap;transition:opacity .5s}
.side{display:grid;gap:var(--s3);align-content:start}
.side .card{padding:var(--s4)}
.ind{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.ind b{font:600 1rem var(--h)}.ind .v{font:500 .95rem var(--m);color:#9a6a08}
:root[data-theme=dark] .ind .v{color:var(--amber)}
.ind .lbl{color:var(--mute);font-size:.85rem}.ind svg{grid-row:1/3;grid-column:2}
.ind.hi .v{color:var(--red)}
.exc{padding:var(--s4);display:grid;gap:var(--s3)}
.yctl{display:grid;gap:var(--s3)}
.yctl .top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap}
button.nd{background:none;border:0;padding:0 10px;cursor:pointer;font-family:var(--m)}
.axis .fl{transition:width .9s cubic-bezier(.4,0,.2,1)}
#exs{margin:var(--s3) 0 var(--s2)}
.src5{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3)}
.src5 .card{padding:var(--s3);display:grid;gap:8px;align-content:start}.src5 .card .mono{font-size:.68rem;color:var(--mute)}
.ctab{display:flex;flex-wrap:wrap;gap:var(--s4);align-items:center;justify-content:space-between;background:var(--navy);color:#eef0e8;border-radius:var(--r);padding:var(--s4)}
.ctab p{color:#b9c9cd;font-size:1.05rem;max-width:56ch}
.ctab .btn-p{background:var(--teal);font-size:1.05rem;padding:14px 26px}
@media(max-width:940px){.exg{grid-template-columns:1fr}.exm .lg{display:none}.exm .bc button{padding:6px 6px;font-size:.6rem}}

/* ---- my farm ---- */
.trail{display:flex;flex-wrap:wrap;gap:6px 10px;font:500 .72rem var(--m);color:var(--mute);margin-bottom:var(--s3)}
.trail span+span:before{content:"/";margin-right:10px;opacity:.5}.trail b{color:var(--ink);font-weight:500}
.fg{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:var(--s3)}
.fm{background:#071822;border:1px solid #ffffff26;border-radius:var(--r);position:relative;overflow:hidden;color:#eef0e8}
.fm svg{display:block;width:100%;height:auto}
.fm .ov{position:absolute;font:400 .68rem var(--m);color:#8fa5ad}
.fm .a{left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}.fm .b{left:12px;bottom:10px}.fm .c{right:12px;bottom:10px;text-align:right}
.draw{stroke-dasharray:900;stroke-dashoffset:900;animation:dr 2.2s .3s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.mtr{position:relative;height:6px;border-radius:3px;background:var(--line);margin:8px 0 4px}
.mtr i{position:absolute;top:-4px;width:3px;height:14px;background:var(--amber);border-radius:2px;transition:left 1s}
.mtr.z{background:linear-gradient(90deg,#168C87,#168C8780 30%,#E7A93B99 55%,#C85C5599)}
.sp{display:grid;grid-template-columns:1fr auto;gap:0 var(--s3);align-items:baseline;padding:12px 0;border-top:1px solid var(--line)}
.sp:first-of-type{border-top:0}.sp .k{color:var(--mute);font-size:.88rem}.sp .v{font:500 1.3rem var(--m)}.sp .v small{font-size:.75rem;color:var(--mute)}
.sp .m{grid-column:1/3}
.dv{font:500 .72rem var(--m);border:1px dashed #e7a93b99;color:#8a5f0a;padding:3px 8px;border-radius:4px;background:#e7a93b14}
:root[data-theme=dark] .dv{color:var(--amber)}
.stt{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.stt .card{padding:var(--s3);display:grid;gap:10px}
.lv{display:flex;gap:4px}.lv i{flex:1;height:6px;border-radius:2px;background:var(--line)}
.lv.a i.on{background:var(--amber)}.lv.t i.on{background:var(--teal)}
.stt b{font:600 1.15rem var(--h)}
.upl{display:grid;grid-template-columns:1fr 1.1fr;gap:var(--s5);align-items:center;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--r);padding:var(--s5)}
.dz{border:1.5px dashed #168c8788;border-radius:var(--r);padding:var(--s4);text-align:center;display:grid;gap:var(--s2);justify-items:center;background:#168c870d}
.dz svg{width:44px;height:44px}
.upp{display:none;margin-top:var(--s3);text-align:left;width:100%;font:400 .82rem var(--m);border-top:1px solid var(--line);padding-top:var(--s3)}

function tmEff(){const c=TM.cur;return{r:c.R*c.p,s:c.S*c.p,w:c.w*c.p,pr:c.pr*c.p}}
function tmScore(cr,e){return cl(cr[2]-(e.s/2)*40*(1-cr[3])-e.w*28*cr[4]-(e.r<0?(-e.r/20)*16*cr[4]:(e.r/20)*8*cr[5])+10*e.pr*cr[6],8,96)}
function tmRender(){const c=TM.cur,e=tmEff(),f=(TM.y-2025)/25,mv=Math.abs(c.p-f)>.012,ph=(c.p<.03&&(mv||f===0))?0:mv?1:f===0?0:2,yr=Math.round(2025+25*c.p);
 document.querySelectorAll('#tmph span').forEach((n,i)=>n.classList.toggle('on',i===ph));
 gid('tmph2').textContent=TM.y+' '+t('scen');gid('tmY').textContent=yr;gid('tmYs').textContent=ph===0?t('cur'):t('ps');
 gid('sumH').textContent=ph===0?t('ph0'):(mv?yr:TM.y)+' '+t('scen');gid('tmgr').style.opacity=c.p*.32;
 gid('tfl').style.width=(c.p*100)+'%';
 document.querySelectorAll('#tax .nd').forEach(n=>{n.classList.toggle('on',+n.dataset.y<=2025+25*c.p+.01);n.classList.toggle('sel',+n.dataset.y===TM.y)});
 const r=Math.round(e.r);gid('s-r').textContent=(r>0?'+':'')+r+'%';gid('s-s').textContent=e.s<.05?t('current'):'+'+e.s.toFixed(1)+' dS/m';
 gid('s-w').textContent=e.w>.5?t('wLim'):t('wNor');gid('s-p').textContent=[t('pLo'),t('pMd'),t('pHi')][TM.P];gid('s-e').textContent=(5.8+e.s).toFixed(1)+' dS/m';
 const sc=CROPS.map(cr=>tmScore(cr,e)),cs=sc.reduce((a,b)=>a+b,0)/sc.length;
 const st=62+e.s/2*30,wa=cl(78-e.w*30+e.r*.9,8,98),so=cl(52-e.s/2*20-e.w*4,8,90);
 gid('g-st').textContent=st<70?t('mh'):t('high');gid('g-wa').textContent=wa>=60?t('gNor'):wa>=42?t('gSome'):t('gLim');gid('g-so').textContent=so>=58?t('modR'):so>=40?t('na'):t('redu');gid('g-cs').textContent=Math.round(cs)+' / 100';
 [['st',st],['wa',wa],['so',so],['cs',cs]].forEach(([k,v])=>gid('b-'+k).style.width=v+'%');
 sc.forEach((v,i)=>{const b=gid('cb'+i);b.style.width=v+'%';b.className=v>=65?'':v>=48?'sd':'am';gid('cn'+i).textContent=Math.round(v)});
 /* scenario visualization */
 const n=Math.round(14+e.r/20*8);document.querySelectorAll('.rd').forEach((l,i)=>l.style.display=i<n?'':'none');
 const k=e.s/2;gid('vTop').setAttribute('fill',mixc([43,58,46],[139,125,90],k));gid('vCr').setAttribute('opacity',Math.min(1,k*1.1));
 document.querySelectorAll('.cry').forEach((q,i)=>q.style.opacity=(i/16<k*1.05)?.9:0);
 const lvl=cl(.78*(1-.32*e.w)+e.r/20*.1,.3,.95),wt=380-lvl*170,it=380-(380-wt)*(.36+.28*k);
 const fr=gid('vFr');fr.setAttribute('y',wt);fr.setAttribute('height',it-wt);const sa=gid('vSal');sa.setAttribute('y',it);sa.setAttribute('height',380-it);
 let pts='';for(let x=-20;x<=660;x+=10)pts+=x+','+(wt+Math.sin(x/28)*3).toFixed(1)+' ';gid('vWp').setAttribute('points',pts);
 gid('vTf').setAttribute('y',wt+18);gid('vTs').setAttribute('y',Math.min(372,it+18));
 const hh=14+cs/100*54,col=mixc([22,140,135],[217,199,163],cl(1-cs/90,0,1));
 document.querySelectorAll('.stm').forEach(l=>{l.setAttribute('y2',140-hh);l.setAttribute('stroke',col)});document.querySelectorAll('.lf').forEach(l=>{l.setAttribute('cy',140-hh);l.setAttribute('fill',col)})}
function tmImp(){const f=(TM.y-2025)/25,d=IM[lang]||IM.en;let L;
 if(TM.y===2025)L=[d.base];else{const s=TM.S*f,r=TM.R*f;L=[d.sal[s<.3?0:s<1?1:s<1.7?2:3],d.wat[TM.W&&f>=.3?1:0],d.rain[r<=-8?0:r>=8?2:1],d.pri[TM.P]]}
 gid('tmi').innerHTML=L.map(a=>`<div class="imp"><b>${a[0]}</b><span>→ ${a[1]}</span></div>`).join('')}
function tmCtl(){const R=TM.R,S=TM.S;gid('cv-r').textContent=(R>0?'+':'')+R+'%';gid('cv-s').textContent=S<.05?t('current'):'+'+S.toFixed(1)+' dS/m';
 const a=(R+20)/40*100,lo=Math.min(50,a),hi=Math.max(50,a),am='var(--amber)',ln='var(--line)';
 gid('c-r').style.background=`linear-gradient(90deg,${ln} ${lo}%,${am} ${lo}%,${am} ${hi}%,${ln} ${hi}%)`;
 gid('c-s').style.background=`linear-gradient(90deg,${am} ${S/2*100}%,${ln} ${S/2*100}%)`;
 document.querySelectorAll('.seg').forEach(g=>{const v=g.dataset.seg==='w'?TM.W:TM.P;g.style.setProperty('--i',v);g.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===v))})}
function tmLoop(ts){const c=TM.cur,g=TM.tgt,dt=TM.last?Math.min(.05,(ts-TM.last)/1000):.016;TM.last=ts;
 const dp=g.p-c.p,st=dt*(.14+Math.abs(dp)*.9);c.p=Math.abs(dp)<=st?g.p:c.p+Math.sign(dp)*st;
 const ko=1-Math.exp(-dt/.16),ks=['R','S','w','pr'];ks.forEach(k=>{c[k]+=(g[k]-c[k])*ko;if(Math.abs(g[k]-c[k])<.004)c[k]=g[k]});
 tmRender();if(c.p!==g.p||ks.some(k=>c[k]!==g[k]))TM.raf=requestAnimationFrame(tmLoop);else{TM.raf=0;TM.last=0}}
function tmGo(){TM.tgt={p:(TM.y-2025)/25,R:TM.R,S:TM.S,w:TM.W,pr:TM.P/2};tmImp();
 if(matchMedia('(prefers-reduced-motion:reduce)').matches){Object.assign(TM.cur,TM.tgt);tmRender();return}
 if(!TM.raf){TM.last=0;TM.raf=requestAnimationFrame(tmLoop)}}
function initTM(){cancelAnimationFrame(TM.raf);TM.raf=0;TM.last=0;if(!gid('tmw'))return;
 if(!TM.seen){TM.cur={p:0,R:TM.R,S:TM.S,w:TM.W,pr:TM.P/2};TM.seen=true}
 const c=gid('tmc');c.addEventListener('input',e=>{if(e.target.id==='c-r')TM.R=+e.target.value;if(e.target.id==='c-s')TM.S=+e.target.value;tmCtl();tmGo()});
 c.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;if(b.parentNode.dataset.seg==='w')TM.W=+b.dataset.v;else TM.P=+b.dataset.v;tmCtl();tmGo()});
 gid('tax').addEventListener('click',e=>{const b=e.target.closest('[data-y]');if(b){TM.y=+b.dataset.y;tmGo()}});
 gid('tmr').addEventListener('click',()=>{TM.cur.p=0;tmGo()});
 tmCtl();tmRender();tmGo()}

<div class="ds"><h3>${t('srcD')}</h3>${SRCS.map(a=>`<div class="sr2"><span>${C.sourceBadge(a[0])}</span><p>${t(a[1])}</p><a class="btn btn-s vs" href="${a[2]}" target="_blank" rel="noopener noreferrer">${t('viewSrc')}</a></div>`).join('')}</div>
<div class="ds tr"><p>${t('transp')}</p><p class="mute" style="margin-top:8px">${t('noCert')}</p></div>`}
P['/results']=()=>{const sc=resScen(),inds=OPTS.map(resInd);return `<div class="view"><div class="wrap exh"><div class="trail rv">${['st0','st1','st3','st4'].map(k=>`<span>${t(k)}</span>`).join('')}<span>${t('tm')}</span><span><b>${t('rsH')}</b></span></div>${C.sectionHeading(t('rsH'),t('rsS'),1).replace('<h1>','<h1 style="font-size:clamp(2.2rem,5vw,4rem)">')}</div>
<div class="wrap"><div class="dark-panel scs rv"><div class="ch"><div><small>${t('undS')}</small><b>${sc.y} ${t('scen')}</b></div><div><small>${t('sRain')}</small><b>${sc.rs}</b></div><div><small>${t('salS')}</small><b>${sc.ss}</b></div><div><small>${t('wa')}</small><b>${sc.w?t('wLim'):t('wNor')}</b></div><div><small>${t('sPri')}</small><b>${[t('pLo'),t('pMd'),t('pHi')][TM.P]}</b></div></div><div class="row">${C.scenarioBadge('sim')}${C.scenarioBadge('proj')}${C.cta(t('adj'),'#/time-machine','s','style="color:#eef0e8;border-color:#ffffff40;padding:8px 14px"')}</div></div>
<p class="mute mono rv" style="font-size:.74rem;margin:var(--s3) 0">${t('rsN')}</p>
<div class="rcg" id="rcg">${OPTS.map(rcard).join('')}</div></div>
<div class="wrap" style="padding-top:var(--s5)"><div class="card mx rv"><h2 style="font-size:1.4rem;margin-bottom:var(--s3)">${t('cmpH')}</h2><div class="mxg"><div class="h"></div>${OPTS.map((o,i)=>`<div class="h">${t('opt')} ${i+1}</div>`).join('')}${IND.map(r=>`<div><b style="font:600 .9rem var(--h)">${t(r[0])}</b></div>`+inds.map(x=>`<div><i class="dt d${x[r[1]]}"></i>${t(ST_K[x[r[1]]])}</div>`).join('')).join('')}</div></div></div>
<div class="wrap" style="padding-top:var(--s6)"><p class="rv" style="font:600 clamp(1.3rem,2.4vw,1.9rem)/1.3 var(--h);max-width:40ch;margin-bottom:var(--s4)">${t('recap')}</p><div class="flow rv"><div class="in"><span>${t('fl1')}</span><span>${t('fl2')}</span><span>${t('fl3')}</span></div><span class="ar">→</span><span class="nx am">${t('fl4')}</span><span class="ar">→</span><span class="nx">${t('fl5')}</span><span class="ar">→</span><span class="nx">${t('fl6')}</span></div>
<div class="row rv" style="margin-top:var(--s5)">${C.cta(t('ctaA'),'#/time-machine','p','style="padding:14px 26px;font-size:1.05rem"')}${C.cta(t('ctaB'),'#/farm','s','style="padding:14px 26px;font-size:1.05rem"')}</div></div>
<div class="finb rv" style="margin-top:var(--s6)"><h2>${t('tag')}</h2><span class="mono">AgriShift</span><span class="mono" style="color:#b9c9cd">${t('team')}</span></div></div>`};
function openWhy(i){const d=document.getElementById('drawer');d.innerHTML=whyHtml(i);d.scrollTop=0;drawer(true);const x=d.querySelector('.x');if(x)x.focus({preventScroll:true})}
function initRes(){const g=document.getElementById('rcg');if(g)g.addEventListener('click',e=>{const b=e.target.closest('[data-rot]');if(b)openWhy(+b.dataset.rot)})}
/* ---------- Router + events ---------- */
const route=()=>location.hash.slice(1)||'/';
function render(){const r=route(),p=P[r]||P['/'];
 document.documentElement.lang=lang==='bn'?'bn':'en';
 document.getElementById('nav').innerHTML=C.navigation(r);
 document.getElementById('app').innerHTML=p();
 document.getElementById('foot').innerHTML=`<p>${t('foot')}</p>`;
 document.getElementById('drawer').innerHTML=C.evidenceDrawer();scrollTo(0,0);init();initEx();initFarm();initTM();initRes()}
function drawer(o){document.getElementById('drawer').classList.toggle('open',o);document.getElementById('scrim').classList.toggle('open',o)}
addEventListener('hashchange',()=>{drawer(false);clearInterval(EX.pt);EX.pt=null;cancelAnimationFrame(TM.raf);TM.seen=false;render()});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;
 if(a.dataset.act==='lang'){lang=a.dataset.v;render()}
 if(a.dataset.act==='evidence')drawer(true);if(a.dataset.act==='close')drawer(false)});
document.addEventListener('input',e=>{if(!e.target.matches('[data-slider]'))return;const v=+e.target.value;
 document.querySelectorAll('[data-slider]').forEach(s=>s.value=v);
 document.querySelectorAll('[id=yr-o]').forEach(o=>o.textContent=v);
 document.querySelectorAll('#tl span').forEach(s=>s.classList.toggle('on',+s.dataset.y<=v))});
addEventListener('keydown',e=>{if(e.key==='Escape')drawer(false)});
render();
</script>
</body>
</html>
